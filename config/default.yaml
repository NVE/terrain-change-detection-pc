# Terrain Change Detection - Canonical Default Configuration
#
# This is the single full config file with all runtime defaults.
#
# Typical usage:
#   uv run scripts/run_workflow.py
#   uv run scripts/run_workflow.py --set paths.base_dir=data/drone_scanning_data --set discovery.source_type=drone
#   uv run scripts/run_workflow.py --config config/profiles/large_scale.yaml
#
# You can layer one or more minimal override YAMLs on top of this file with
# repeated --config flags, and override any single setting with repeated --set
# KEY=VALUE arguments.

paths:
  # Root folder containing area subdirectories
  # Expected structure: base_dir/area/time_period/[data/]*.laz
  # NOTE: base_dir should point to the parent of area folders, NOT to an area folder itself
  base_dir: data/raw
  # Base directory for all output files; null = auto-generate in base_dir/output/
  output_dir: null
  # CRS for outputs (auto-detect from LAZ if possible, fallback to this)
  output_crs: "EPSG:25833"

preprocessing:
  # If true, keep only LAS class 2 (ground) unless classification_filter is set
  ground_only: true
  # Optional list of LAS classification codes to include; overrides ground_only
  classification_filter: [2]

coordinates:
  # Transform large projected coordinates to a local frame for numerical stability
  use_local_coordinates: true
  # Origin method: min_bounds | centroid | first_point
  origin_method: min_bounds
  # Also offset Z values when true
  include_z_offset: false

discovery:
  # Data source type: hoydedata | drone
  # - hoydedata: area/time_period/data/*.laz structure (hoydedata.no format)
  # - drone: area/time_period/*.laz structure (no 'data' subdirectory)
  source_type: hoydedata
  # Subdirectory names (used only when source_type: hoydedata)
  data_dir_name: data
  metadata_dir_name: metadata

clipping:
  # Enable clipping point clouds to a region of interest before processing
  # Use this to focus analysis on specific areas (e.g., rivers, erosion zones)
  enabled: false
  # Path to GeoJSON (.geojson, .json) or Shapefile (.shp) defining the clipping boundary
  # The file should contain polygon(s) representing the area of interest
  boundary_file: null
  # Name of specific feature to use if the file contains multiple features
  # If null, all polygons in the file are combined into one clipping boundary
  feature_name: null
  # Save clipped LAZ files to disk for reuse in subsequent runs
  save_clipped_files: false
  # Directory to save clipped files; null = auto-generate based on area name
  output_dir: null

alignment:
  # Enable ICP fine registration for spatial alignment (disable for pre-aligned data)
  enabled: true
  # ICP/registration parameters
  max_iterations: 100
  tolerance: 1.0e-6
  max_correspondence_distance: 1.0
  # Number of points sampled per epoch for alignment (approx.)
  subsample_size: 50000
  # Subsampling mode: 'count' uses subsample_size, 'percent' uses subsample_percent
  subsample_mode: count
  # Percentage of points to subsample (used when subsample_mode: percent)
  subsample_percent: 10.0
  # Safety cap: maximum number of subsampled points regardless of mode
  max_subsample_size: 500000
  # Convergence criteria for motion-based stopping
  convergence_translation_epsilon: 1.0e-4
  convergence_rotation_epsilon_deg: 0.1
  # Random seed for reproducible subsampling (deterministic by default)
  random_seed: 42
  # Filter points to bounding-box overlap region before subsampling
  overlap_filter: true
  # Margin in meters to expand the overlap bounding box
  overlap_margin_m: 5.0
  # Which epoch is the ICP reference: t1 (earlier) or t2 (later)
  reference: t1
  # ICP implementation: 'custom' (built-in SVD) or 'open3d' (Open3D library)
  icp_backend: custom
  # Export aligned point cloud as LAZ file
  export_aligned_pc: false
  coarse:  # Only use if point clouds are significantly misaligned
    enabled: false
    # Coarse alignment method: centroid | pca | phase | open3d_fpfh | none
    method: centroid
    # Voxel size (m) for coarse features/downsampling
    voxel_size: 2.0
    # Cell size (m) for phase correlation grid
    phase_grid_cell: 2.0
  multiscale:
    # Optional coarse-to-fine ICP refinement pass
    enabled: false
    coarse_subsample_size: 20000
    coarse_max_iterations: 30
    # Null means reuse alignment.max_correspondence_distance
    coarse_max_correspondence_distance: null

detection:
  dod:
    enabled: false
    # DEM grid resolution in meters
    cell_size: 1.0
    # Aggregation for per-cell elevation: mean | median | p95 | p5
    aggregator: mean
    # Export DoD as GeoTIFF raster
    export_raster: false
  c2c:
    enabled: false
    # Algorithm: euclidean | vertical_plane
    mode: euclidean
    # Upper bound used by some example flows for sampling/limits
    max_points: 9000000
    # Search radius (m). Required for streaming C2C; null uses in-memory mode.
    max_distance: 10.0  # meters
    # Local modeling parameters (for mode=vertical_plane)
    radius: null
    k_neighbors: 20
    min_neighbors: 6
    # Export C2C distances as LAZ point cloud
    export_pc: false
    # Export C2C as interpolated GeoTIFF raster
    export_raster: false
  m3c2:
    enabled: true
    # Use automatic parameter tuning (true) or fixed parameters below (false)
    use_autotune: false
    # Percentage of reference ground points to use as M3C2 core points
    core_points_percent: 100.0
    # (Optional) Absolute number of core points - overrides percentage if set
    # core_points: null
    autotune:
      # Source for density estimate: header | sample
      source: header
      # Target neighbor count for choosing scales
      target_neighbors: 16
      # Half-depth along normal as a fraction of cylinder radius
      max_depth_factor: 1.0
      # Min/max search radii (m) for scale selection
      min_radius: 1.0
      max_radius: 20.0
    # Fixed parameters (used only when use_autotune: false). Leave as null to accept defaults.
    fixed:
      radius: 1.0          # If set, projection_scale=cylinder_radius=radius
      normal_scale: 1.0    # Defaults to radius when null
      depth_factor: 2.0    # If null, falls back to autotune.max_depth_factor
    # Export M3C2 core points with distances as LAZ point cloud
    export_pc: true
    # Export M3C2 distances as interpolated GeoTIFF raster
    export_raster: true

visualization:
  # plotly | pyvista | pyvistaqt
  backend: plotly
  # Max points to draw for interactive views
  sample_size: 100000

logging:
  level: INFO
  # Path to log file; null = stdout only
  file: null

performance:
  # Set to an integer to pin NumPy threads; 'auto' lets NumPy decide
  numpy_threads: auto

outofcore:
  # Master switch for streaming/tiling out-of-core workflows
  enabled: false
  # Inner tile size in meters (processing region per tile)
  tile_size_m: 500.0
  # Halo width in meters (buffer around each tile to avoid edge effects)
  halo_m: 20.0
  # Max points per streaming chunk (memory/performance trade-off)
  chunk_points: 1000000
  # Use streaming mode in preprocessing when out-of-core is enabled
  streaming_mode: true
  # Save transformed LAZ files during alignment to disk
  save_transformed_files: false
  # Output directory for transformed files; null = auto-generate
  output_dir: null
  # Directory for memory-mapped arrays in mosaicking; null = in-memory
  memmap_dir: null

parallel:
  # Master switch for CPU parallelization
  enabled: false
  # Number of worker processes; null = auto-detect (cpu_count - 1)
  n_workers: null
  # Soft memory limit (GB) to guide worker count; null = no limit
  memory_limit_gb: null
  # BLAS/NumPy threads per worker to avoid oversubscription
  threads_per_worker: 1

gpu:
  # Master switch for GPU acceleration (graceful CPU fallback if unavailable)
  # WARNING: Cannot be used simultaneously with parallel.enabled due to CUDA fork limitations
  enabled: false
  # Max GPU memory to use in GB; null = auto-detect (80% of available)
  gpu_memory_limit_gb: null
  # Automatically fall back to CPU if GPU initialization fails
  fallback_to_cpu: true
  # Use GPU for C2C nearest neighbor searches (10-50x speedup potential)
  use_for_c2c: true
  # Use GPU for DoD grid accumulation
  use_for_dod: true
  # Use GPU for data preprocessing (transformations, filtering)
  use_for_preprocessing: true
  # Use GPU for ICP spatial alignment (experimental)
  use_for_alignment: false
  # GPU batch size for operations; null = auto-calculate based on memory
  batch_size: null
