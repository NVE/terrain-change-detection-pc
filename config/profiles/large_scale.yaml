# Minimal override preset for large out-of-core terrain datasets.

alignment:
  coarse:
    method: phase
    voxel_size: 5.0
    phase_grid_cell: 5.0

detection:
  dod:
    enabled: true
    cell_size: 2.0
    export_raster: true
  c2c:
    enabled: true
    max_points: 10000
  m3c2:
    use_autotune: true
    core_points_percent: 5.0
    autotune:
      target_neighbors: 20
      min_radius: 2.0
      max_radius: 30.0
    fixed:
      radius: null
      normal_scale: null
      depth_factor: null

logging:
  file: logs/large_scale_processing.log

outofcore:
  enabled: true
  halo_m: 30.0
  chunk_points: 2000000

parallel:
  enabled: true

gpu:
  use_for_alignment: true
