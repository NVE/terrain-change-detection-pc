# Minimal override preset for drone-scanned point cloud datasets.

paths:
  base_dir: data/drone_scanning_data

discovery:
  source_type: drone

alignment:
  max_correspondence_distance: 2.0
  coarse:
    enabled: true
    method: phase
    voxel_size: 1.0
    phase_grid_cell: 1.0

detection:
  dod:
    enabled: true
    cell_size: 0.5
    export_raster: true
  c2c:
    max_points: 5000000
    max_distance: null
  m3c2:
    use_autotune: true
    core_points_percent: 10.0
    autotune:
      max_depth_factor: 0.6
      min_radius: 0.5
      max_radius: 10.0
    fixed:
      radius: null
      normal_scale: null
      depth_factor: null

visualization:
  sample_size: 50000
