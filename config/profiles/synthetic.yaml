# Minimal override preset for local synthetic development runs.

paths:
  base_dir: data/synthetic

visualization:
  sample_size: 20000

alignment:
  max_iterations: 80
  subsample_size: 30000

detection:
  c2c:
    mode: vertical_plane
    max_points: 8000
    max_distance: null
    radius: 2.0
  m3c2:
    use_autotune: true
    autotune:
      max_depth_factor: 0.6
    fixed:
      radius: null
      normal_scale: null
      depth_factor: null

outofcore:
  tile_size_m: 300.0
  chunk_points: 20000
