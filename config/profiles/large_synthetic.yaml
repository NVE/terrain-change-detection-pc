# Minimal override preset for the generated large synthetic dataset.

paths:
  base_dir: data/large_synthetic

alignment:
  max_correspondence_distance: 2.0
  subsample_size: 100000
  coarse:
    method: phase
    voxel_size: 3.0
    phase_grid_cell: 3.0

detection:
  dod:
    enabled: true
    cell_size: 2.0
    export_raster: true
  c2c:
    max_points: 10000
  m3c2:
    use_autotune: true
    core_points_percent: 10.0
    autotune:
      target_neighbors: 20
      max_depth_factor: 0.6
      min_radius: 0.0
      max_radius: 50.0
    fixed:
      radius: null
      normal_scale: null
      depth_factor: null

logging:
  file: logs/large_synthetic_processing.log

outofcore:
  enabled: true
  tile_size_m: 1000.0
  halo_m: 30.0
  chunk_points: 2000000

parallel:
  enabled: true
